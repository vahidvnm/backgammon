name: Android APK

on:
  push:
    branches: [main, arena/01a0b377-backgammon]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Surface compiler diagnostics
        if: failure()
        run: |
          echo '### Build diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(^e: | error: |FAILURE:|What went wrong|Compilation error)" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          echo "::error::BUILD_LOG_BASE64=$(tail -20 build.log | base64 -w0)"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backgammon-Build-Log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backgammon-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
