name: Android APK

on:
  push:
    branches: [main, arena/01a0b377-backgammon]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Surface compiler diagnostics
        if: failure()
        run: |
          echo '### Build diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(^e: | error: |FAILURE:|What went wrong|Compilation error)" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          echo "::error::BUILD_LOG_BASE64=$(awk '/FAILURE:/{show=1} show{print} /Try:/{exit}' build.log | head -30 | base64 -w0)"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backgammon-Build-Log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backgammon-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download CC0 wooden dice recordings
        run: |
          set -eux
          for n in 1 2 3 4; do
            curl --retry 5 --retry-all-errors -L -o "$n.flac" "https://opengameart.org/sites/default/files/Holzw%C3%BCrfel_auf_Holztisch_${n}.flac"
          done
      - name: Build a clean two-dice wooden roll
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -i 3.flac -i 1.flac -filter_complex "[0:a]volume=1.0[a];[1:a]adelay=105|105,volume=.82[b];[a][b]amix=inputs=2:duration=longest:normalize=0,highpass=f=90,lowpass=f=8500,loudnorm=I=-17:TP=-1.5:LRA=7[out]" -map "[out]" -ar 44100 -ac 1 dice_roll.wav
      - name: Emit audio for sandbox import
        run: base64 -w0 dice_roll.wav | fold -w3000 | sed 's/^/DICE_B64:/'
      - uses: actions/upload-artifact@v4
        with:
          name: CC0-Wooden-Dice-Audio
          path: dice_roll.wav
