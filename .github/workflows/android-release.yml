name: AI Backgammon Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            echo 'Signing secrets are not configured; producing unsigned validation binaries.'
          fi
      - name: Test, lint and build release
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest lintRelease bundleRelease assembleRelease --stacktrace 2>&1 | tee release-build.log
      - name: Verify signing status
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"; then
            echo '### ✅ Production-signed release generated' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### ⚠️ Unsigned release generated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload release binaries
        uses: actions/upload-artifact@v5
        with:
          name: AI-Backgammon-Release-Binaries
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: AI-Backgammon-Release-Log
          path: release-build.log
