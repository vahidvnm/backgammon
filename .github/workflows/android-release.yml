name: AI Backgammon Release

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0b377-backgammon']
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            echo 'Signing secrets are not configured; producing unsigned validation binaries.'
          fi

      - name: Validate release signing key
        run: |
          test -s "$ANDROID_KEYSTORE_PATH" || {
            echo 'ERROR: ANDROID_KEYSTORE_BASE64 is missing or decoded to an empty file.'
            exit 1
          }
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Test, lint and build release
        run: |
          set -o pipefail
          ./gradlew testMyketReleaseUnitTest testBazaarReleaseUnitTest lintMyketRelease lintBazaarRelease bundleMyketRelease bundleBazaarRelease assembleMyketRelease assembleBazaarRelease --stacktrace 2>&1 | tee release-build.log

      - name: Verify signing status
        run: |
          if find app/build/outputs/apk/{myket,bazaar}/release -name '*.apk' -print0 | xargs -0 -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose; then
            echo '### ✅ Production-signed release generated' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### ⚠️ Unsigned release generated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Cafe Bazaar Bundle Signer 0.1.13
        run: |
          curl -fL --retry 3 --retry-all-errors \
            -o bundle-signer-0.1.13.jar \
            https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.13/bundlesigner-0.1.13.jar

      - name: Generate Cafe Bazaar BIN
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH" || {
            echo 'ERROR: Release keystore is not configured; Cafe Bazaar BIN cannot be generated.'
            exit 1
          }

          AAB=$(find app/build/outputs/bundle/bazaarRelease -name '*.aab' -type f | head -1)

          test -n "$AAB" || {
            echo 'ERROR: Release AAB was not found.'
            exit 1
          }

          mkdir -p app/build/outputs/cafebazaar

          java -jar bundle-signer-0.1.13.jar genbin \
            -v \
            --bundle "$AAB" \
            --bin app/build/outputs/cafebazaar \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD"

          BIN=$(find app/build/outputs/cafebazaar -name '*.bin' -type f | head -1)

          test -s "$BIN" || {
            echo 'ERROR: Cafe Bazaar BIN was not generated.'
            exit 1
          }

          echo "### ✅ Cafe Bazaar BIN generated: $(basename "$BIN")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release binaries
        uses: actions/upload-artifact@v5
        with:
          name: Smart-Backgammon-Marketplace-Release-Binaries
          path: |
            app/build/outputs/bundle/myketRelease/*.aab
            app/build/outputs/bundle/bazaarRelease/*.aab
            app/build/outputs/apk/myket/release/*.apk
            app/build/outputs/apk/bazaar/release/*.apk
            app/build/outputs/cafebazaar/*.bin
          if-no-files-found: error

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: AI-Backgammon-Release-Log
          path: release-build.log
