name: Android Emulator Game Journeys

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real game journeys on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -lc './gradlew connectedMyketDebugAndroidTest --stacktrace 2>&1 | tee emulator-test.log; exit ${PIPESTATUS[0]}'
      - name: Surface emulator diagnostics
        if: failure()
        run: |
          tail -120 emulator-test.log
          grep -E -B12 -A25 '(^e: |error:|FAILURE:|What went wrong|Execution failed|FAILED)' emulator-test.log > emulator-errors.log || true
          echo "::error::EMULATOR_LOG_BASE64=$(head -120 emulator-errors.log | base64 -w0)"
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Backgammon-Android-Emulator-Reports
          path: |
            emulator-test.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
