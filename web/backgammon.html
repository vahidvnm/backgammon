<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grand Backgammon</title>
<style>
:root{--gold:#edc56f;--ivory:#f4dfad;--burgundy:#742a36;--wood:#6b351f;--dark:#190b07;--felt:#a9754c;--unit:min(1vw,1.75vh)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101713;color:#fff;font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,#4f3b2b66,#09110d 70%),repeating-linear-gradient(88deg,#5a3c2822 0 2px,transparent 2px 19px);filter:contrast(1.1)}
.game{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:7.5vh 6vw 3vh}.status{position:absolute;z-index:30;top:0;left:0;right:0;height:6.5vh;min-height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:linear-gradient(90deg,#120d0ceF,#35251fee,#120d0cef);border-bottom:1px solid #f8d99055;box-shadow:0 5px 18px #0008;color:#ead6a6}.brand{font-family:Georgia,serif;font-size:clamp(18px,2.2vw,34px);letter-spacing:.12em;color:#f3d88d;text-shadow:0 2px 2px #000}.status-mid{font-size:clamp(11px,1.1vw,16px);font-weight:800;letter-spacing:.14em}.score{display:flex;align-items:center;gap:1.2vw;font-weight:800}.beads{display:flex;gap:3px}.bead{width:7px;height:7px;border-radius:50%;background:#fff2}.bead.on{background:var(--gold);box-shadow:0 0 7px #ffd66f}
.board-shell{position:relative;width:min(82vw,135vh);aspect-ratio:1.79;border-radius:18px;padding:clamp(9px,1.15vw,20px);background:linear-gradient(145deg,#b26d42 0,#69351f 22%,#3b190f 55%,#7f4226 82%,#2b110b);box-shadow:0 28px 55px #000b, inset 0 3px 2px #f2b78399,inset 0 -7px 10px #160704,0 0 0 2px #2a1009,0 0 0 4px #c1845655}.board-shell:before{content:"";position:absolute;inset:5px;border-radius:14px;border:2px solid #e5a26a44;pointer-events:none}.woodgrain{position:absolute;inset:0;border-radius:18px;opacity:.26;mix-blend-mode:multiply;background:repeating-linear-gradient(2deg,transparent 0 8px,#321307 9px 10px,transparent 11px 22px),radial-gradient(ellipse at 25% 12%,transparent 0 19%,#42190b55 20% 21%,transparent 22%)}
.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1fr 7.2%;background:#a97851;box-shadow:inset 0 0 23px #1e0908,inset 0 2px 3px #f5c89577;overflow:hidden;border-radius:6px}.field{position:relative;display:grid;grid-template-columns:repeat(6,1fr) 8.4% repeat(6,1fr);grid-template-rows:1fr 1fr;background:linear-gradient(90deg,#a6754c,#bc8b5c 44%,#9a6842 50%,#b98558);overflow:hidden}.field:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(1deg,transparent 0 12px,#5b321522 13px 14px,transparent 15px 27px),linear-gradient(#fff1,transparent 18%,#0001 50%,transparent 82%,#0002)}.bar{grid-column:7;grid-row:1/3;z-index:3;background:linear-gradient(90deg,#351308,#7a4023 16%,#9b5e37 50%,#6a341d 84%,#2d1008);box-shadow:-5px 0 8px #18070399,5px 0 8px #18070399,inset 2px 0 #e5a26a55;position:relative}.bar.selected{filter:brightness(1.3)}
.point{position:relative;min-width:0;z-index:4;cursor:pointer}.point .wedge{position:absolute;left:2%;width:96%;height:86%;filter:drop-shadow(0 2px 1px #35100a55)}.point.top .wedge{top:0;clip-path:polygon(0 0,100% 0,50% 100%)}.point.bottom .wedge{bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.point.a .wedge{background:linear-gradient(90deg,#4b1221,#8c3544 45%,#5d1728);box-shadow:inset 4px 0 #fff1}.point.b .wedge{background:linear-gradient(90deg,#cdb27c,#f6e2ae 48%,#c4a46d)}.point.legal:after{content:"";position:absolute;width:34%;aspect-ratio:1;border-radius:50%;left:33%;background:#ffd84a;box-shadow:0 0 0 5px #ffd74a44,0 0 18px 8px #ffe16a99;animation:pulse .7s alternate infinite}.point.top.legal:after{top:58%}.point.bottom.legal:after{bottom:58%}@keyframes pulse{to{transform:scale(1.22);opacity:.65}}
.tray{position:relative;background:linear-gradient(90deg,#4a2112,#7d4428 45%,#3a160c);box-shadow:inset 5px 0 10px #160704}.tray-slot{position:absolute;left:19%;width:62%;height:42%;border-radius:10px;background:linear-gradient(90deg,#190b07,#36170e,#170906);box-shadow:inset 0 5px 12px #000,inset 0 -2px #b7724544;border:1px solid #c8875144}.tray-slot.top{top:4%}.tray-slot.bottom{bottom:4%}.tray.legal .tray-slot{box-shadow:inset 0 5px 12px #000,0 0 16px #ffd65a}
.checker{position:absolute;z-index:10;width:clamp(26px,4.1vw,62px);aspect-ratio:1;border-radius:50%;left:50%;transform:translateX(-50%);cursor:pointer;touch-action:none;filter:drop-shadow(0 5px 3px #17080588);transition:filter .18s,transform .18s}.checker:before{content:"";position:absolute;inset:8%;border-radius:50%;border:max(2px,.22vw) solid #0005;box-shadow:inset 0 2px 5px #fff5,inset 0 -5px 8px #0006}.checker:after{content:"";position:absolute;left:20%;top:12%;width:42%;height:22%;border-radius:50%;background:#fff7;filter:blur(1px);transform:rotate(-18deg)}.checker.white{background:radial-gradient(circle at 32% 25%,#fffbdc 0 10%,#efd58e 25%,#bb8138 72%,#5c3016 100%);border:2px solid #f8e5ab;box-shadow:inset 0 0 0 2px #815021,inset 0 -6px 8px #774017}.checker.black{background:radial-gradient(circle at 32% 24%,#a76d50 0 8%,#542a20 28%,#24100d 74%,#080403 100%);border:2px solid #9d6851;box-shadow:inset 0 0 0 2px #1a0a07,inset 0 -6px 8px #080302}.checker.selected{transform:translateX(-50%) translateY(-8px) scale(1.08);filter:drop-shadow(0 10px 5px #0008) drop-shadow(0 0 8px #ffd65c);outline:3px solid #ffd45f}.checker.dragging{position:fixed!important;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(1.12)}
.dice-zone{position:absolute;z-index:20;left:44%;top:43%;display:flex;gap:1vw;pointer-events:none}.die{width:clamp(34px,4vw,60px);aspect-ratio:1;border-radius:16%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;background:radial-gradient(circle at 30% 22%,#fffdf1,#ead7b4 62%,#a98c65);border:2px solid #fff7df;box-shadow:0 8px 9px #210b0788,inset 0 -5px 8px #846744,inset 0 3px 4px #fff;transform-style:preserve-3d}.pip{align-self:center;justify-self:center;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6d5745,#17100c 75%);box-shadow:inset 0 2px 2px #000,0 1px #fff4}.die.rolling:first-child{animation:rollA .95s cubic-bezier(.2,.8,.2,1)}.die.rolling:last-child{animation:rollB 1.05s cubic-bezier(.2,.8,.2,1)}@keyframes rollA{0%{transform:translate(-100px,-60px) rotate(0) scale(.9)}45%{transform:translate(20px,35px) rotate(420deg) scale(1.08)}75%{transform:translate(-8px,-8px) rotate(660deg)}100%{transform:none}}@keyframes rollB{0%{transform:translate(100px,-45px) rotate(0)}50%{transform:translate(-25px,30px) rotate(-500deg) scale(1.08)}78%{transform:translate(7px,-5px) rotate(-700deg)}100%{transform:none}}
.controls{position:absolute;z-index:35;left:1.2vw;top:15%;display:flex;flex-direction:column;gap:1.3vh}.btn{min-width:clamp(48px,5vw,74px);min-height:clamp(44px,6vh,62px);padding:.7em 1.1em;color:#f4dfaf;font:bold clamp(11px,1vw,16px) Georgia,serif;letter-spacing:.06em;border:1px solid #d69d6266;border-radius:12px;background:linear-gradient(#784327,#3a190f);box-shadow:0 6px 12px #0008,inset 0 2px #e2a46c77,inset 0 -4px #180704;cursor:pointer}.btn:hover{filter:brightness(1.18)}.btn:active{transform:translateY(3px);box-shadow:0 2px 5px #0009,inset 0 2px 6px #160604}.btn:disabled{filter:grayscale(.7);opacity:.45}.cube{font-size:1.15em}
.toast{position:absolute;z-index:40;bottom:2vh;left:50%;transform:translateX(-50%);padding:.65em 1.4em;border-radius:99px;background:#130d0dda;border:1px solid #ecc66d55;color:#f3dfb0;font-weight:700;opacity:0;transition:.25s}.toast.show{opacity:1}.modal{position:fixed;z-index:100;inset:0;display:none;place-items:center;background:#070504bb;backdrop-filter:blur(8px)}.modal.show{display:grid}.panel{min-width:min(440px,86vw);padding:34px;border:1px solid #e7c27777;border-radius:24px;text-align:center;background:linear-gradient(145deg,#3d271eeb,#17100ded);box-shadow:0 25px 80px #000;color:#f4dfb0}.panel h1{font-family:Georgia,serif;color:#ffd878}
@media(max-width:700px){.game{padding-left:2vw;padding-right:2vw}.brand{display:none}.board-shell{width:91vw}.controls{left:.4vw}.btn{padding:.5em}.status{padding:0 2vw}}
</style>
</head>
<body><div class="game">
<header class="status"><div class="brand">BACKGAMMON</div><div class="score"><span>IVORY</span><div class="beads" id="whiteScore"></div><b id="scoreText">0 — 0</b><div class="beads" id="blackScore"></div><span>ONYX</span></div><div class="status-mid" id="turnText">IVORY TO ROLL</div><button class="btn" id="menuBtn">MENU</button></header>
<div class="controls"><button class="btn" id="rollBtn">ROLL DICE</button><button class="btn" id="doubleBtn">DOUBLE</button><button class="btn" id="undoBtn">UNDO</button><button class="btn cube" id="cubeBtn">×1</button></div>
<div class="board-shell"><div class="woodgrain"></div><main class="board"><section class="field" id="field"><div class="bar" id="bar"></div></section><aside class="tray" id="tray"><div class="tray-slot top"></div><div class="tray-slot bottom"></div></aside></main></div>
<div class="dice-zone" id="dice"></div><div class="toast" id="toast"></div></div>
<div class="modal" id="modal"><div class="panel"><h1 id="modalTitle">Game Menu</h1><p id="modalText">Premium Backgammon</p><button class="btn" id="newBtn">NEW GAME</button> <button class="btn" id="closeBtn">CLOSE</button></div></div>
<script>
'use strict';
const WHITE=1,BLACK=-1,BAR=24,OFF=25;
let state,selected=null,legal=[],history=[],cube=1,scores={1:0,'-1':0},busy=false;
const field=document.querySelector('#field'),tray=document.querySelector('#tray'),bar=document.querySelector('#bar');
function initial(){let p=Array(24).fill(0);p[23]=2;p[12]=5;p[7]=3;p[5]=5;p[0]=-2;p[11]=-5;p[16]=-3;p[18]=-5;return{p,barW:0,barB:0,offW:0,offB:0,turn:WHITE,dice:[],rolled:false,winner:0}}
function clone(s){return{...s,p:[...s.p],dice:[...s.dice]}}
function barCount(s,pl){return pl===WHITE?s.barW:s.barB}function offCount(s,pl){return pl===WHITE?s.offW:s.offB}
function open(s,i,pl){return s.p[i]*pl>=-1}
function canBear(s,pl,from,die){if(barCount(s,pl))return false;let home=pl===WHITE?[0,1,2,3,4,5]:[18,19,20,21,22,23];if(s.p.some((v,i)=>!home.includes(i)&&v*pl>0))return false;let exact=pl===WHITE?from+1===die:24-from===die;if(exact)return true;if(pl===WHITE&&die>from+1)return !Array.from({length:5-from},(_,k)=>from+1+k).some(i=>s.p[i]>0);if(pl===BLACK&&die>24-from)return !Array.from({length:from-18},(_,k)=>18+k).some(i=>s.p[i]<0);return false}
function rawMoves(s,die){let pl=s.turn;if(barCount(s,pl)){let to=pl===WHITE?24-die:die-1;return open(s,to,pl)?[{from:BAR,to,die}]:[]}let out=[];for(let from=0;from<24;from++)if(s.p[from]*pl>0){let to=from+(pl===WHITE?-die:die);if(to>=0&&to<24&&open(s,to,pl))out.push({from,to,die});else if((to<0||to>23)&&canBear(s,pl,from,die))out.push({from,to:OFF,die})}return out}
function apply(s,m){let n=clone(s),pl=n.turn;if(m.from===BAR){pl===WHITE?n.barW--:n.barB--}else n.p[m.from]-=pl;if(m.to===OFF){pl===WHITE?n.offW++:n.offB++}else{if(n.p[m.to]===-pl){n.p[m.to]=0;pl===WHITE?n.barB++:n.barW++}n.p[m.to]+=pl}return n}
function sequences(s,dice){if(!dice.length)return[[]];let all=[];[...new Set(dice)].forEach(d=>{let rest=[...dice];rest.splice(rest.indexOf(d),1);rawMoves(s,d).forEach(m=>sequences(apply(s,m),rest).forEach(q=>all.push([m,...q]))) });if(!all.length)return[[]];let max=Math.max(...all.map(x=>x.length));let best=all.filter(x=>x.length===max);if(max===1&&new Set(dice).size>1){let hi=Math.max(...best.map(x=>x[0].die));best=best.filter(x=>x[0].die===hi)}return best}
function legalMoves(){return sequences(state,state.dice).map(x=>x[0]).filter(Boolean).filter((m,i,a)=>a.findIndex(n=>n.from===m.from&&n.to===m.to&&n.die===m.die)===i)}
function pointGrid(i){let col=i<12?11-i:i-12,top=i>=12;return{col:col<6?col+1:col+2,row:top?1:2,top}}
function buildBoard(){document.querySelectorAll('.point').forEach(e=>e.remove());for(let i=0;i<24;i++){let g=pointGrid(i),d=document.createElement('div');d.className=`point ${g.top?'top':'bottom'} ${(g.col+(g.top?0:1))%2?'a':'b'}`;d.dataset.point=i;d.style.gridColumn=g.col;d.style.gridRow=g.row;d.innerHTML='<i class="wedge"></i>';d.onclick=()=>pointClick(i);field.appendChild(d)}bar.onclick=()=>sourceClick(BAR);tray.onclick=()=>destinationClick(OFF)}
function checker(pl,place,index,count){let c=document.createElement('div');c.className=`checker ${pl===WHITE?'white':'black'} ${selected===place?'selected':''}`;c.dataset.source=place;let gap=Math.min(17,66/Math.max(5,count))*1.0;if(place===BAR){c.style.left='50%';c.style[pl===WHITE?'bottom':'top']=(8+index*gap)+'%'}else if(place===OFF){c.style.left='50%';c.style[pl===WHITE?'bottom':'top']=(5+index*gap)+'%'}else{let top=place>=12;c.style[top?'top':'bottom']=(2+index*gap)+'%'}c.onclick=e=>{e.stopPropagation();sourceClick(place)};installDrag(c);return c}
function render(){document.querySelectorAll('.checker').forEach(e=>e.remove());document.querySelectorAll('.point').forEach(e=>e.classList.remove('legal'));tray.classList.remove('legal');bar.classList.toggle('selected',selected===BAR);for(let i=0;i<24;i++){let n=Math.abs(state.p[i]),point=document.querySelector(`[data-point="${i}"]`);for(let k=0;k<n;k++)point.appendChild(checker(Math.sign(state.p[i]),i,k,n))}for(let k=0;k<state.barW;k++)bar.appendChild(checker(WHITE,BAR,k,state.barW));for(let k=0;k<state.barB;k++)bar.appendChild(checker(BLACK,BAR,k,state.barB));let slots=tray.querySelectorAll('.tray-slot');for(let k=0;k<state.offB;k++)slots[0].appendChild(checker(BLACK,OFF,k,state.offB));for(let k=0;k<state.offW;k++)slots[1].appendChild(checker(WHITE,OFF,k,state.offW));legal.forEach(m=>{if(m.from===selected){if(m.to===OFF)tray.classList.add('legal');else document.querySelector(`[data-point="${m.to}"]`)?.classList.add('legal')}});document.querySelector('#turnText').textContent=state.winner?(state.winner===WHITE?'IVORY WINS':'ONYX WINS'):!state.rolled?(state.turn===WHITE?'IVORY TO ROLL':'ONYX TO ROLL'):`${state.dice.length} MOVE${state.dice.length===1?'':'S'} LEFT`;document.querySelector('#rollBtn').disabled=busy||state.rolled||state.winner;document.querySelector('#doubleBtn').disabled=state.rolled||state.winner;document.querySelector('#undoBtn').disabled=!history.length;document.querySelector('#cubeBtn').textContent='×'+cube;renderScore()}
function sourceClick(src){if(busy||!state.rolled)return;let owns=src===BAR?barCount(state,state.turn)>0:src>=0&&state.p[src]*state.turn>0;if(!owns)return;let moves=legalMoves().filter(m=>m.from===src);if(!moves.length){notify('That checker has no legal move');return}selected=src;legal=legalMoves();render()}
function pointClick(i){if(selected!=null){let choices=legal.filter(m=>m.from===selected&&m.to===i);if(choices.length)return makeMove(choices.sort((a,b)=>b.die-a.die)[0])}sourceClick(i)}function destinationClick(to){if(selected==null)return;let m=legal.filter(x=>x.from===selected&&x.to===to).sort((a,b)=>b.die-a.die)[0];if(m)makeMove(m)}
function makeMove(m){if(busy)return;history.push({state:clone(state),cube});let source=selected===BAR?bar:document.querySelector(`[data-point="${selected}"]`),piece=source?.querySelector('.checker:last-of-type'),dest=m.to===OFF?tray:document.querySelector(`[data-point="${m.to}"]`);busy=true;if(piece&&dest){let a=piece.getBoundingClientRect(),b=dest.getBoundingClientRect(),ghost=piece.cloneNode(true);ghost.style.position='fixed';ghost.style.left=a.left+'px';ghost.style.top=a.top+'px';ghost.style.margin=0;ghost.style.zIndex=999;ghost.style.pointerEvents='none';document.body.appendChild(ghost);piece.style.opacity=0;ghost.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2-45}px) scale(1.08)`,offset:.58},{transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(1)`}],{duration:480,easing:'cubic-bezier(.2,.75,.25,1)'}).onfinish=()=>{ghost.remove();finishMove(m)}}else finishMove(m)}
function finishMove(m){state=apply(state,m);state.dice.splice(state.dice.indexOf(m.die),1);selected=null;legal=[];busy=false;if(offCount(state,state.turn)===15){state.winner=state.turn;scores[state.turn]+=cube;showWin();render();return}let moves=legalMoves();if(!state.dice.length||!moves.length)setTimeout(endTurn,280);render()}
function endTurn(){state.turn*=-1;state.dice=[];state.rolled=false;selected=null;legal=[];render()}
function roll(){if(state.rolled||busy)return;let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);state.dice=a===b?[a,a,a,a]:[a,b];state.rolled=true;busy=true;drawDice(a,b,true);document.querySelector('#rollBtn').disabled=true;setTimeout(()=>{busy=false;drawDice(a,b,false);if(!legalMoves().length){notify('No legal moves');setTimeout(endTurn,650)}render()},1050)}
function drawDice(a,b,rolling=false){let z=document.querySelector('#dice');z.innerHTML='';[a,b].forEach(v=>{let d=document.createElement('div');d.className='die'+(rolling?' rolling':'');let spots={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]}[v];for(let i=1;i<=9;i++){let p=document.createElement('i');if(spots.includes(i))p.className='pip';p.style.gridArea=`${Math.ceil(i/3)}/${(i-1)%3+1}`;d.appendChild(p)}z.appendChild(d)})}
function installDrag(el){el.onpointerdown=e=>{if(!state.rolled)return;el.setPointerCapture(e.pointerId);let moved=false;el.onpointermove=q=>{moved=true;el.classList.add('dragging');el.style.left=q.clientX+'px';el.style.top=q.clientY+'px'};el.onpointerup=q=>{el.onpointermove=null;el.classList.remove('dragging');if(moved){let hit=document.elementFromPoint(q.clientX,q.clientY)?.closest('.point,.tray');sourceClick(+el.dataset.source);if(hit?.classList.contains('point'))pointClick(+hit.dataset.point);else if(hit?.classList.contains('tray'))destinationClick(OFF)}render()}}}
function undo(){if(!history.length||busy)return;let h=history.pop();state=h.state;cube=h.cube;selected=null;legal=[];drawDice(...(state.dice.length?state.dice:[1,1]));render()}function doubleCube(){if(state.rolled)return;cube=Math.min(64,cube*2);render()}
function renderScore(){document.querySelector('#scoreText').textContent=`${scores[WHITE]} — ${scores[BLACK]}`;for(let [id,pl] of [['whiteScore',WHITE],['blackScore',BLACK]]){let n=document.querySelector('#'+id);n.innerHTML='';for(let i=0;i<5;i++){let b=document.createElement('i');b.className='bead '+(i<scores[pl]?'on':'');n.appendChild(b)}}}
function notify(t){let n=document.querySelector('#toast');n.textContent=t;n.classList.add('show');clearTimeout(n.t);n.t=setTimeout(()=>n.classList.remove('show'),1600)}function showWin(){document.querySelector('#modalTitle').textContent=state.winner===WHITE?'IVORY WINS':'ONYX WINS';document.querySelector('#modalText').textContent=`Match score ${scores[WHITE]} — ${scores[BLACK]}`;document.querySelector('#modal').classList.add('show')}
function newGame(){state=initial();history=[];cube=1;selected=null;legal=[];drawDice(1,1);document.querySelector('#modal').classList.remove('show');render()}
document.querySelector('#rollBtn').onclick=roll;document.querySelector('#undoBtn').onclick=undo;document.querySelector('#doubleBtn').onclick=doubleCube;document.querySelector('#cubeBtn').onclick=doubleCube;document.querySelector('#menuBtn').onclick=()=>document.querySelector('#modal').classList.add('show');document.querySelector('#closeBtn').onclick=()=>document.querySelector('#modal').classList.remove('show');document.querySelector('#newBtn').onclick=newGame;buildBoard();newGame();
</script></body></html>
